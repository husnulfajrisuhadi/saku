<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Putar</title>
  <meta name="theme-color" content="#0E0F13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Putar">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="/icons/icon-192.png" alt="" width="28" height="28">
        <h1>Putar</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnAccount" aria-label="Akun dan sinkronisasi">
          <svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5H7Z"/></svg>
          <span class="dot" id="cloudDot" hidden></span>
        </button>
        <label class="icon-btn primary" aria-label="Tambah lagu">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple hidden>
        </label>
      </div>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input type="search" id="search" placeholder="Cari judul atau artis" autocomplete="off">
    </div>

    <div class="list-head">
      <span id="countLabel">0 lagu</span>
      <div class="list-head-actions">
        <button class="chip" id="btnShuffleAll">
          <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          Acak semua
        </button>
        <button class="chip" id="btnSort">Terbaru</button>
      </div>
    </div>

    <div class="cloud-banner" id="cloudBanner" hidden>
      <div>
        <strong id="cloudBannerTitle">Lagu di cloud</strong>
        <span id="cloudBannerText"></span>
      </div>
      <button class="chip accent" id="btnDownloadAll">Unduh semua</button>
    </div>

    <ul class="tracks" id="trackList"></ul>

    <div class="empty" id="emptyState" hidden>
      <div class="empty-art">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <h2>Belum ada lagu</h2>
      <p>Tambahkan file MP3 dari iPhone kamu. Lagu disimpan di perangkat ini, jadi bisa diputar tanpa internet.</p>
      <label class="btn-primary">
        Tambah lagu
        <input type="file" id="fileInput2" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple hidden>
      </label>
    </div>
  </div>

  <!-- Mini player -->
  <div class="mini" id="mini" hidden>
    <div class="mini-progress"><div id="miniBar"></div></div>
    <button class="mini-main" id="miniOpen" aria-label="Buka pemutar">
      <div class="cover sm" id="miniCover"></div>
      <div class="mini-text">
        <div class="t" id="miniTitle">-</div>
        <div class="a" id="miniArtist">-</div>
      </div>
    </button>
    <button class="icon-btn ghost" id="miniPlay" aria-label="Putar atau jeda"></button>
    <button class="icon-btn ghost" id="miniNext" aria-label="Lagu berikutnya">
      <svg viewBox="0 0 24 24" class="fill"><path d="M5 5.5v13a1 1 0 0 0 1.5.86L16 13.6V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.4L6.5 4.64A1 1 0 0 0 5 5.5Z"/></svg>
    </button>
  </div>

  <!-- Full player -->
  <section class="player" id="player" aria-hidden="true">
    <div class="player-bg" id="playerBg"></div>
    <div class="player-inner">
      <div class="player-top">
        <button class="icon-btn ghost" id="playerClose" aria-label="Tutup">
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span class="player-label">Sedang diputar</span>
        <button class="icon-btn ghost" id="playerMore" aria-label="Opsi lagu">
          <svg viewBox="0 0 24 24" class="fill"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
      <div class="cover lg" id="playerCover"></div>
      <div class="player-meta">
        <div class="t" id="playerTitle">-</div>
        <div class="a" id="playerArtist">-</div>
      </div>
      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Posisi lagu">
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="controls">
        <button class="icon-btn ghost toggle" id="btnShuffle" aria-label="Acak">
          <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="icon-btn ghost big" id="btnPrev" aria-label="Sebelumnya">
          <svg viewBox="0 0 24 24" class="fill"><path d="M19 5.5v13a1 1 0 0 1-1.5.86L8 13.6V18a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v4.4l9.5-5.76A1 1 0 0 1 19 5.5Z"/></svg>
        </button>
        <button class="play-btn" id="btnPlay" aria-label="Putar atau jeda"></button>
        <button class="icon-btn ghost big" id="btnNext" aria-label="Berikutnya">
          <svg viewBox="0 0 24 24" class="fill"><path d="M5 5.5v13a1 1 0 0 0 1.5.86L16 13.6V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.4L6.5 4.64A1 1 0 0 0 5 5.5Z"/></svg>
        </button>
        <button class="icon-btn ghost toggle" id="btnRepeat" aria-label="Ulangi">
          <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
          <span class="badge" id="repeatOne" hidden>1</span>
        </button>
      </div>
      <div class="skip-row">
        <button class="chip" id="btnBack10">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg> 10 dtk
        </button>
        <button class="chip" id="btnFwd10">
          10 dtk <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Bottom sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="auto" playsinline></audio>

  <script src="/vendor/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="/id3.js"></script>
  <script src="/app.js"></script>
</body>
</html>
